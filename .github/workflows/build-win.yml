name: Build Windows App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright python-dotenv telethon pillow rapidocr_onnxruntime pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --name "Netflix_Veo_Veo" --add-data ".env;." --add-data "templates.json;." --add-data "alert.aiff;." --collect-all rapidocr_onnxruntime sharetool.py

    - name: Prepare templates.json in dist folder
      run: |
        copy templates.json dist\Netflix_Veo_Veo\

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Netflix_VeoVeo_Win
        path: dist/Netflix_Veo_Veo/
